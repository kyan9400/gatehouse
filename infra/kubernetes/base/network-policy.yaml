apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: gatehouse-api-default-deny
  namespace: gatehouse
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: gatehouse-api
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: gatehouse-web
      ports:
        - protocol: TCP
          port: 8000
  egress:
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: TCP
          port: 5432
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
